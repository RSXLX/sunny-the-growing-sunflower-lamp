name: MVP checks
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js && node --check web/viewer.js
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Ihardware/firmware/include hardware/firmware/test/logic_test.cpp -o /tmp/bloom-logic && /tmp/bloom-logic
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - run: pio run -d hardware/firmware
