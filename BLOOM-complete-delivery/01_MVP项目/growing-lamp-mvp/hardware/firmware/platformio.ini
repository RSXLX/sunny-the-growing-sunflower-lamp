[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PN532 @ 1.3.4
  adafruit/Adafruit BusIO @ 1.16.1
  bblanchon/ArduinoJson @ 6.21.5
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINOJSON_USE_LONG_LONG=1
; Platform 6.9.0 deliberately pins Arduino-ESP32 2.0.17.
; Do not upgrade to Arduino 3.x without adapting the LEDC API and rerunning tests.
